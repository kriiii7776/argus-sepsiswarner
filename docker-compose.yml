services:
  postgres:
    image: postgres:16-alpine
    container_name: argus_postgres
    environment:
      POSTGRES_DB: sepsisguard
      POSTGRES_USER: sepsisguard
      POSTGRES_PASSWORD: sepsisguard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sepsisguard -d sepsisguard"]
      interval: 5s
      timeout: 5s
      retries: 5

  part1:
    build:
      context: ./part1/backend
      dockerfile: Dockerfile
    container_name: argus_part1_simulator
    environment:
      - ARGUS_HOST=0.0.0.0
      - ARGUS_PORT=8001
      - ARGUS_DEMO_MODE=true
      - ARGUS_DEMO_PATIENT_ID=PATIENT-001
      - ARGUS_DEMO_SPEED=1.0
    ports:
      - "8001:8001"
    volumes:
      - ./.argus_live_part1_registry_20261002.json:/app/patient_registry.json
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8001/api/v1/health\")'"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: deployment/backend/Dockerfile
    container_name: argus_part2_backend
    environment:
      - DATABASE_URL=postgresql+psycopg://sepsisguard:sepsisguard@postgres:5432/sepsisguard
      - ARGUS_PART1_BRIDGE_ENABLED=true
      - ARGUS_PART1_WS_URL=ws://part1:8001/api/v1/stream
      - HOST=0.0.0.0
      - PORT=8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      part1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/v1/health\")'"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
